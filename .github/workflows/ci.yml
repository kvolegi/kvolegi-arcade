name: Arcade Multiplatform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test Engine & Cross-Platform Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [ '17' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit Test Suite (75 Tests)
        run: mvn test

      - name: Build Universal Cross-Platform JAR
        if: matrix.os == 'ubuntu-latest'
        run: mvn package -DskipTests
