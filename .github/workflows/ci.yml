name: CI / Cross-Platform Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Headless Simulation Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java-version: ['17', '21']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Headless Arcade Test Suite
        run: python3 tests/run_tests.py

  package-universal-jar:
    name: Build & Verify Universal Cross-Platform JAR
    runs-on: ubuntu-latest
    needs: [test-matrix]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Universal Multi-OS JAR
        run: python3 build_all.py

      - name: Verify Universal JAR Integrity
        run: |
          test -f builds/kvolegi-arcade-universal.jar
          jar tf builds/kvolegi-arcade-universal.jar | grep "arcade/desktop/Main.class"
          echo "Universal JAR package verification passed successfully."

      - name: Upload Universal JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvolegi-arcade-universal-jar
          path: builds/kvolegi-arcade-universal.jar
          if-no-files-found: error
