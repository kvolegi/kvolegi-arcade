name: "🐛 Bug Report"
description: "Report a gameplay, layout, or rendering issue"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "Describe the unexpected behavior."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "Platform"
      options:
        - "Android APK (Mobile)"
        - "macOS (.app / jar)"
        - "Windows (.exe / jar)"
        - "Linux (Universal jar)"
    validations:
      required: true
